<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec='http://www.thymeleaf.org/extras/spring-security'>
<head>
    <!-- basic -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- site metas -->
    <title>Housing details</title>
    <meta name="keywords" content="">
    <meta name="description" content="">
    <meta name="author" content="">
    <!-- bootstrap css -->
    <link rel="stylesheet" type="text/css" href="/css/bootstrap.min.css">
    <!-- style css -->
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    <!-- Responsive-->
    <link rel="stylesheet" href="/css/responsive.css">
    <!-- fevicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png"/>
    <!-- Scrollbar Custom CSS -->
    <link rel="stylesheet" href="/css/jquery.mCustomScrollbar.min.css">
    <!-- Tweaks for older IEs-->
    <link rel="stylesheet" href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
    <!-- fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;800&family=Sen:wght@400;700;800&display=swap"
          rel="stylesheet">
    <!-- Fontawesome CSS -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.9/css/all.css">
    <link rel="stylesheet" href="https://cdn.materialdesignicons.com/3.0.39/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
<!-- header top section start -->
<div th:replace="~{fragments/header_top_section::header_top_section}"></div>
<!-- header top section start -->
<!-- header section start -->
<div>
    <div th:replace="~{fragments/header_section::header_section(activeLink='services')}"></div>
</div>
<!-- header section end -->
<div class="housing-details container"
     th:object="${propertyDetails}">
    <h2 th:text="#{property.details.title}">Property Details</h2>
    <div th:if="${message}">
        <p th:text="${message}" style="color: orange; font-size: 15px"></p>
    </div>
    <div class="row align-items-center">
        <div class="col-lg-6 col-md-12 main_image_container mb-4">
            <div class="property_image_wrapper">
                <img th:src="@{*{pictureUrl}}" alt="Main Property Image" id="mainImage"
                     class="housing-details main_image img-fluid">
                <div class="favorite_badge" th:if="${isFavorite}" title="Favorite">
                    <i class="mdi mdi-star"></i>
                </div>
            </div>
        </div>
        <div class="col-lg-6 col-md-12 housing-details details_section mb-4">
            <p><strong th:text="#{attraction.details.city}">City: </strong> <span
                    th:text="#{|city.filter.*{city}|}"></span></p>
            <p><strong th:text="#{attraction.details.address}">Address: </strong> <span th:text="*{address}"></span></p>
            <th:block th:if="${entityType == 'housing'}">
                <div th:replace="~{fragments/housing_details_fields::housing_details_fields}"></div>
            </th:block>
            <th:block th:if="${entityType == 'car'}">
                <div th:replace="~{fragments/car_details_fields::car_details_fields}"></div>
            </th:block>
            <p>
                <strong th:text="#{attraction.details.price}">Price: </strong>
                <span th:text="*{price}"></span>
                <span th:text="#{property.details.day}">/day</span>
                </p>
        </div>
    </div>
    <div class="row details_action_row">
        <button class="details_button" id="rentButton" th:text="#{property.details.rent}">Rent</button>
        <form class="favorite_form" th:method="post"
              th:action="@{/{entityType}/add-to-favorites/{uuid} (uuid= ${uuid}, entityType= ${entityType})}">
            <button class="details_button favorite_button" th:classappend="${isFavorite} ? 'is_favorite' : ''" type="submit">
                <i id="favorite" class="favorite mdi mdi-star" th:if="${isFavorite}"></i>
                <span th:text="#{property.details.add.favorites}">Add to favorites</span>
            </button>
        </form>
        <form class="delete_form" th:method="delete"
              th:action="@{/{entityType}/details/{uuid} (uuid= ${uuid}, entityType= ${entityType})}">
            <button class="details_button" sec:authorize="hasRole('ADMIN')" th:text="#{property.details.delete.add}">
                Delete add
            </button>
        </form>
    </div>

    <!-- Rent Modal -->
    <div id="rentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header-custom">
                <h3 class="modal-title" th:text="#{property.details.select.dates}">Select Dates</h3>
                <button type="button" class="close close-modal-btn" aria-label="Close">&times;</button>
            </div>
            <form id="rentForm"
                  th:action="@{/{entityType}/rent/{uuid} (uuid= ${uuid}, entityType= ${entityType})}"
                  th:method="post">
                <div class="unavailable-periods-section" th:if="${rentPeriods != null and not #lists.isEmpty(rentPeriods)}">
                    <h4 class="unavailable-periods-heading" th:text="#{property.details.unavailable.period}">Unavailable Rent Periods</h4>
                    <div class="unavailable-table-responsive">
                        <table class="rented_periods">
                            <thead>
                            <tr>
                                <th th:text="#{property.details.start.date}">Start Date</th>
                                <th th:text="#{property.details.end.date}">End Date</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="period : ${rentPeriods}">
                                <td th:text="${period.startDate}"></td>
                                <td th:text="${period.endDate}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="rent-form-group">
                    <label for="startDate" id="startDateLabel" th:text="#{property.details.start.date.label}">Start Date:</label>
                    <div class="rent-input-wrapper">
                        <i class="mdi mdi-calendar rent-input-icon"></i>
                        <input type="text" id="startDate" name="startDate" required readonly
                               th:placeholder="#{property.details.choose.date}">
                    </div>
                </div>
                <div class="rent-form-group">
                    <label for="endDate" id="endDateLabel" th:text="#{property.details.end.date.label}">End Date:</label>
                    <div class="rent-input-wrapper">
                        <i class="mdi mdi-calendar rent-input-icon"></i>
                        <input type="text" id="endDate" name="endDate" required readonly
                               th:placeholder="#{property.details.choose.date}">
                    </div>
                </div>
                <div id="dateErrorMessage" class="date-error-message" style="display: none;"></div>
                <div class="rent-modal-actions">
                    <button type="submit" id="submitRentForm" disabled th:text="#{property.details.submit}">Submit</button>
                </div>
            </form>
        </div>
    </div>
    <article class="comment-section">
        <h2 th:text="#{property.details.comments}">Comments</h2>

        <!-- Existing Comments -->
        <div class="comment_box container" id="comments">
            <div class="housing-details comment"
                 th:each="comment : *{comments}">
                <div class="author" th:text="${comment.getUser().getUsername()}">Author Name</div>
                <div class="comment_text" th:text="${comment.getText()}"
                     th:placeholder="#{property.details.comments.placeholder}">Comment text goes here...
                </div>
            </div>
        </div>

        <!-- Add New Comment (Only for logged-in users) -->
        <form class="add-comment"
              sec:authorize="isAuthenticated()"
              th:action="@{/{entityType}/details/{uuid} (uuid=${uuid}, entityType= ${entityType})}"
              th:method="post"
              th:object="${commentData}">
            <h3 class="table-title title" th:text="#{property.details.add.comment}">Add a Comment</h3>
            <th:block th:errors="*{text}" class="invalid-feedback danger">Error
                message!
            </th:block>
            <div>
                <textarea th:field="*{text}"
                          th:errorclass="is-invalid" id="comment" name="comment" rows="4" required></textarea>
                <button type="submit" th:text="#{property.details.add.submit}">Submit</button>
            </div>
        </form>

        <!-- Message for non-logged in users -->
        <div class="comment-login-prompt" sec:authorize="isAnonymous()">
            <div class="comment-login-card">
                <div class="comment-login-icon-box">
                    <i class="fa fa-comments" aria-hidden="true"></i>
                </div>
                <div class="comment-login-info">
                    <h4 class="comment-login-title" th:text="#{property.details.add.comment}">Add a Comment</h4>
                    <p class="comment-login-text" th:text="#{property.details.login.to.comment}">Please log in to your account if you wish to leave a comment.</p>
                </div>
                <a class="comment-login-btn" th:href="@{/users/login}">
                    <i class="fa fa-sign-in" aria-hidden="true"></i>
                    <span th:text="#{header.section.login}">Login</span>
                </a>
            </div>
        </div>
    </article>
</div>
<!-- footer section start -->
<div th:replace="~{fragments/footer_section::footer_section}"></div>
<!-- footer section end -->
<!-- copyright section start -->
<div th:replace="~{fragments/copyright_section::copyright_section}"></div>
<!-- copyright section end -->

<!-- jquery latest version -->
<script src="/js/jquery.min.js"></script>
<!-- popper.min.js -->
<script src="/js/popper.min.js"></script>
<!-- bootstrap js -->
<script src="/js/bootstrap.bundle.min.js"></script>
<!-- script js -->
<script src="/js/script.js"></script>

<script src="/js/add_comment.js"></script>
<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script src="/js/flatpickr.js"></script>
</body>
</html>
